<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHERFALL — Whispers of the Sunken Starlace</title>
<meta name="description" content="A third-person open-world adventure vignette in Three.js — collect the seven fallen shards of the Starlace.">
<meta property="og:title" content="AETHERFALL — Whispers of the Sunken Starlace">
<meta property="og:description" content="A cel-shaded open-world vignette built in Three.js. Every mesh, texture, shader and note of music is procedural.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='40%25' cy='35%25'%3E%3Cstop offset='0' stop-color='%23dffaff'/%3E%3Cstop offset='.6' stop-color='%2358c8f0'/%3E%3Cstop offset='1' stop-color='%232a86c8'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' fill='%230a1626'/%3E%3Cpath d='M16 3l7 13-7 13-7-13z' fill='url(%23g)'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1420; }
    #app canvas { display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none;
          font-family: 'Alegreya', serif; color: #f2ead6; z-index: 10; }
    #ui button { pointer-events: auto; cursor: pointer; }

    .hidden { display: none !important; }

    /* ---------- title ---------- */
    #title-screen {
      position: absolute; inset: 0; pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(20,45,75,0.25), rgba(6,14,26,0.88)),
        linear-gradient(180deg, #10243c 0%, #0a1626 100%);
    }
    .title-inner { text-align: center; max-width: 720px; padding: 24px; animation: fadeIn 1.4s ease both; }
    .title-eyebrow {
      font-family: 'Cinzel', serif; letter-spacing: 0.55em; text-transform: uppercase;
      font-size: 11px; color: #9db8d4; margin-bottom: 18px;
    }
    .title-inner h1 {
      font-family: 'Cinzel', serif; font-weight: 700; font-size: clamp(52px, 9vw, 96px);
      letter-spacing: 0.16em; line-height: 1;
      background: linear-gradient(180deg, #fdf6e3 15%, #e8cf8f 50%, #b98f4a 90%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 0 42px rgba(232, 207, 143, 0.28);
    }
    .title-sub {
      font-style: italic; font-size: 19px; color: #cfe0ef; margin-top: 12px;
      letter-spacing: 0.08em;
    }
    .title-intro { color: #a9bccf; font-size: 15px; line-height: 1.65; margin: 26px auto 34px; max-width: 560px; }
    #btn-begin {
      font-family: 'Cinzel', serif; font-size: 16px; letter-spacing: 0.22em;
      padding: 15px 46px; color: #f5ecd7;
      background: linear-gradient(180deg, rgba(64,96,138,0.35), rgba(30,50,78,0.35));
      border: 1px solid rgba(232,207,143,0.65); border-radius: 2px;
      transition: all 0.25s ease;
    }
    #btn-begin:hover {
      background: linear-gradient(180deg, rgba(94,132,182,0.5), rgba(44,70,106,0.5));
      box-shadow: 0 0 26px rgba(232,207,143,0.35); transform: translateY(-1px);
    }
    .title-controls {
      display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: center;
      margin-top: 36px; font-size: 13px; color: #8fa6bd;
    }
    .title-controls b { color: #d8c89a; font-weight: 500; }

    /* ---------- tracker ---------- */
    .panel {
      position: absolute; top: 22px; right: 26px; text-align: right;
      background: rgba(10, 20, 34, 0.42); border: 1px solid rgba(220,200,150,0.35);
      border-radius: 3px; padding: 12px 16px; backdrop-filter: blur(6px);
    }
    .tracker-title { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.1em; color: #ecdfba; }
    #shard-pips { display: flex; gap: 7px; justify-content: flex-end; margin-top: 9px; }
    .pip {
      width: 11px; height: 11px; transform: rotate(45deg) scale(0.82);
      border: 1px solid rgba(160,190,215,0.55); background: rgba(120,160,200,0.12);
      transition: all 0.5s ease;
    }
    .pip.lit {
      background: radial-gradient(circle at 40% 35%, #dffaff, #58c8f0 60%, #2a86c8);
      border-color: #bfeeff; box-shadow: 0 0 10px rgba(110,210,255,0.9);
    }

    /* ---------- stamina ---------- */
    #stamina-wrap {
      position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%);
      width: 240px; height: 7px; border-radius: 4px; overflow: hidden;
      background: rgba(8,16,28,0.55); border: 1px solid rgba(230,220,180,0.4);
    }
    #stamina-bar {
      height: 100%; width: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #f5e79a, #ffe95e);
      box-shadow: 0 0 8px rgba(255,233,94,0.55);
      transition: width 0.08s linear;
    }
    #stamina-wrap.low #stamina-bar { background: linear-gradient(90deg,#f0a06a,#ff7a4e); }

    /* ---------- prompt / toast ---------- */
    #prompt {
      position: absolute; bottom: 118px; left: 50%; transform: translateX(-50%);
      font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.14em;
      color: #f5ecd2; text-shadow: 0 1px 6px rgba(0,0,0,0.8);
      background: rgba(10,20,34,0.4); border: 1px solid rgba(220,200,150,0.3);
      padding: 8px 20px; border-radius: 2px;
    }
    #toast {
      position: absolute; top: 84px; left: 50%; transform: translateX(-50%);
      font-style: italic; font-size: 16px; color: #eee6cd;
      text-shadow: 0 1px 8px rgba(0,0,0,0.85); animation: fadeIn 0.5s ease both;
      white-space: nowrap;
    }

    /* ---------- dialogue ---------- */
    #dialogue {
      position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
      width: min(680px, calc(100vw - 48px));
      background: linear-gradient(180deg, rgba(12,22,38,0.88), rgba(8,15,27,0.92));
      border: 1px solid rgba(222,202,152,0.55); border-radius: 3px;
      padding: 20px 26px 16px; backdrop-filter: blur(8px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 0 60px rgba(80,110,150,0.08);
    }
    #dlg-name {
      font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.2em;
      color: #e8cf8f; margin-bottom: 10px;
    }
    #dlg-name::before { content: '❖ '; color: #b9a05e; }
    #dlg-text { font-size: 17px; line-height: 1.7; color: #e9e4d4; min-height: 84px; white-space: pre-line; }
    #dlg-hint { text-align: right; font-size: 12px; color: #93a7bd; margin-top: 8px; letter-spacing: 0.1em; }

    /* ---------- finale ---------- */
    #finale {
      position: absolute; inset: 0; pointer-events: auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, rgba(30,60,100,0.25), rgba(5,12,24,0.85));
      animation: fadeIn 2s ease both;
    }
    #finale h2 {
      font-family: 'Cinzel', serif; font-size: clamp(30px, 5vw, 54px); letter-spacing: 0.18em;
      background: linear-gradient(180deg, #fdf6e3, #e8cf8f 60%, #b98f4a);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #finale p { max-width: 600px; text-align: center; margin: 26px 0 34px; line-height: 1.9; color: #d5dee8; font-size: 17px; }
    #btn-roam {
      font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.2em;
      padding: 12px 36px; color: #f5ecd7; background: rgba(40,66,100,0.4);
      border: 1px solid rgba(232,207,143,0.55); border-radius: 2px; transition: all .25s;
    }
    #btn-roam:hover { background: rgba(70,104,150,0.55); box-shadow: 0 0 22px rgba(232,207,143,0.3); }

    /* ---------- pause ---------- */
    #pause {
      position: absolute; inset: 0; pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, rgba(14,30,52,0.55), rgba(4,10,20,0.86));
      backdrop-filter: blur(3px);
      animation: fadeIn 0.18s ease both;
    }
    .pause-card {
      width: min(440px, calc(100vw - 40px)); text-align: center;
      background: linear-gradient(180deg, rgba(13,24,40,0.94), rgba(8,15,27,0.96));
      border: 1px solid rgba(222,202,152,0.5); border-radius: 4px;
      padding: 30px 34px 24px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.6), inset 0 0 70px rgba(80,110,150,0.07);
    }
    .pause-eyebrow {
      font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.5em;
      text-transform: uppercase; color: #8fa6bd;
    }
    .pause-card h2 {
      font-family: 'Cinzel', serif; font-size: 40px; letter-spacing: 0.22em;
      margin: 8px 0 4px;
      background: linear-gradient(180deg, #fdf6e3, #e8cf8f 60%, #b98f4a);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #pause-progress { font-size: 14px; color: #a9bccf; margin-bottom: 22px; }
    .pause-shards { color: #bfeeff; font-family: 'Cinzel', serif; font-size: 16px; }
    .pause-actions { display: grid; gap: 9px; }
    .pause-actions button {
      font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.18em;
      padding: 12px 18px; color: #f5ecd7;
      background: linear-gradient(180deg, rgba(64,96,138,0.32), rgba(30,50,78,0.32));
      border: 1px solid rgba(232,207,143,0.5); border-radius: 2px;
      transition: all 0.2s ease;
    }
    .pause-actions button:hover {
      background: linear-gradient(180deg, rgba(94,132,182,0.5), rgba(44,70,106,0.5));
      box-shadow: 0 0 22px rgba(232,207,143,0.28); transform: translateY(-1px);
    }
    #btn-resume { border-color: rgba(232,207,143,0.9); }
    .pause-controls {
      display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center;
      margin-top: 22px; font-size: 12px; color: #7f93a8;
    }
    .pause-controls b { color: #d8c89a; font-weight: 500; }

    /* ---------- world select ---------- */
    #world-select {
      position: absolute; inset: 0; pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, rgba(14,30,52,0.6), rgba(4,10,20,0.9));
      backdrop-filter: blur(3px); animation: fadeIn 0.18s ease both;
    }
    .ws-card {
      width: min(520px, calc(100vw - 40px)); text-align: center;
      background: linear-gradient(180deg, rgba(13,24,40,0.96), rgba(8,15,27,0.97));
      border: 1px solid rgba(222,202,152,0.5); border-radius: 4px;
      padding: 28px 30px 22px; box-shadow: 0 18px 60px rgba(0,0,0,0.6);
    }
    .ws-eyebrow { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.4em;
      text-transform: uppercase; color: #8fa6bd; }
    .ws-card h2 { font-family: 'Cinzel', serif; font-size: 30px; letter-spacing: 0.18em;
      margin: 8px 0 18px;
      background: linear-gradient(180deg, #fdf6e3, #e8cf8f 60%, #b98f4a);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    #ws-list { display: grid; gap: 9px; }
    .ws-item {
      display: flex; align-items: baseline; gap: 12px; padding: 13px 18px;
      font-family: 'Cinzel', serif; color: #f5ecd7; text-align: left; cursor: pointer;
      background: linear-gradient(180deg, rgba(64,96,138,0.22), rgba(30,50,78,0.22));
      border: 1px solid rgba(232,207,143,0.35); border-radius: 3px; transition: all 0.2s ease;
    }
    .ws-item:hover { background: linear-gradient(180deg, rgba(94,132,182,0.4), rgba(44,70,106,0.4));
      border-color: rgba(232,207,143,0.8); }
    .ws-item.current { opacity: 0.55; pointer-events: none; }
    .ws-name { font-size: 15px; letter-spacing: 0.12em; }
    .ws-tag { font-family: 'Alegreya', serif; font-style: italic; font-size: 13px; color: #a9bccf; }
    .ws-hint { font-size: 12px; color: #7f93a8; margin-top: 16px; }

    /* ---------- combat ---------- */
    #health-wrap {
      position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
      width: 190px; text-align: center;
    }
    #health-track {
      height: 9px; border-radius: 5px; overflow: hidden;
      background: rgba(8,16,28,0.55); border: 1px solid rgba(230,210,180,0.4);
    }
    #health-bar {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #e25b4e, #ff7a6a);
      box-shadow: 0 0 8px rgba(255,90,70,0.6); transition: width 0.1s linear;
    }
    #health-wrap.low #health-bar { background: linear-gradient(90deg,#c23a2c,#ff5040); }
    #enemy-tally { margin-top: 6px; font-family: 'Cinzel', serif; font-size: 12px;
      letter-spacing: 0.14em; color: #d8c89a; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

    #death {
      position: absolute; inset: 0; pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 45%, rgba(60,10,30,0.5), rgba(4,8,18,0.9));
      backdrop-filter: blur(3px); animation: fadeIn 0.3s ease both;
    }
    .die-card { width: min(380px, calc(100vw - 40px)); text-align: center;
      background: linear-gradient(180deg, rgba(30,14,26,0.95), rgba(14,8,18,0.97));
      border: 1px solid rgba(200,120,110,0.5); border-radius: 4px; padding: 30px 32px 26px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.6); }
    .die-card p { color: #c9b8bd; font-size: 14px; line-height: 1.6; margin: 10px 0 22px; }
    #btn-revive { font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.18em;
      padding: 12px 36px; color: #f5ecd7; background: rgba(120,60,60,0.4);
      border: 1px solid rgba(255,180,150,0.5); border-radius: 2px; cursor: pointer; transition: all .2s; }
    #btn-revive:hover { background: rgba(160,80,70,0.55); box-shadow: 0 0 22px rgba(255,150,120,0.3); }

    /* ---------- perf + settings ---------- */
    #perf {
      position: absolute; top: 22px; left: 26px;
      font-family: 'Alegreya', serif; font-size: 12px; line-height: 1.5;
      color: #b9cbdd; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      background: rgba(10,20,34,0.34); border: 1px solid rgba(220,200,150,0.22);
      border-radius: 3px; padding: 7px 11px; backdrop-filter: blur(5px);
    }
    #perf b { color: #f0e6c8; font-size: 15px; font-weight: 700; }
    #perf-cull { margin-top: 3px; color: #8fa6bd; font-size: 11px; }

    #settings {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      pointer-events: auto;
      width: min(430px, calc(100vw - 40px));
      background: linear-gradient(180deg, rgba(12,22,38,0.92), rgba(8,15,27,0.95));
      border: 1px solid rgba(222,202,152,0.5); border-radius: 4px;
      padding: 18px 22px 14px; backdrop-filter: blur(9px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.55);
    }
    .set-title {
      font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.2em;
      color: #e8cf8f; margin-bottom: 12px;
    }
    .set-auto { display: flex; align-items: center; gap: 8px; font-size: 13px;
      color: #cfe0ef; margin-bottom: 14px; cursor: pointer; }
    .set-auto input { accent-color: #e8cf8f; cursor: pointer; }
    .set-row { display: grid; grid-template-columns: 116px 1fr 58px;
      align-items: center; gap: 10px; margin-bottom: 9px; }
    .set-label { font-size: 12px; color: #a9bccf; }
    .set-val { font-size: 12px; color: #e8cf8f; text-align: right;
      font-family: 'Cinzel', serif; letter-spacing: 0.05em; }
    .set-row input[type=range] { width: 100%; accent-color: #e8cf8f; cursor: pointer; }
    .set-hint { font-size: 11px; color: #7f93a8; margin-top: 10px; line-height: 1.5; }
    .set-hint b { color: #d8c89a; }

    /* ---------- frame ---------- */
    #vignette-frame {
      position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 140px rgba(4, 10, 20, 0.55);
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
